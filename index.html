'use strict';const KEY='petaldose_lavender_v2';const today=()=>new Date().toLocaleDateString('en-CA');const dateAdd=(s,n)=>{let d=new Date(s+'T12:00:00');d.setDate(d.getDate()+n);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};const diff=(a,b)=>Math.round((new Date(b+'T12:00:00')-new Date(a+'T12:00:00'))/86400000);const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const fmt=(v,n=2)=>Number.isFinite(+v)?Number(v).toLocaleString(undefined,{maximumFractionDigits:n}):'—';let db;try{db=JSON.parse(localStorage.getItem(KEY))||{}}catch{db={}};for(const k of ['schedules','logs','vials','stock'])if(!Array.isArray(db[k]))db[k]=[];db.prefs=db.prefs||{};let page='home',picked=today(),month=today().slice(0,7),editing=null,filter='calendar';function save(){try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){alert('Unable to save locally. Please export a backup.')}}function scheduleOn(s,d){if(d<s.start||s.end&&d>s.end)return false;if(s.paused&&(!s.resume||d<s.resume))return false;let delta=diff(s.start,d);if(delta<0)return false;if(s.freq==='dates')return (s.dates||[]).includes(d);if(s.freq==='daily')return true;if(s.freq==='interval')return delta%Math.max(1,+s.interval||1)===0;return (s.days||[]).map(Number).includes(new Date(d+'T12:00:00').getDay())}function planned(d){return db.schedules.filter(s=>scheduleOn(s,d)).sort((a,b)=>(a.time||'').localeCompare(b.time||''))}function logOf(id,d){return db.logs.find(l=>l.scheduleId===id&&l.scheduledDate===d)}function doseMg(s){return (+s.dose||0)*(s.unit==='mcg'?0.001:1)}function used(v){return db.logs.filter(l=>l.status==='taken'&&l.vialId===v.id).reduce((n,l)=>n+(+l.doseMg||0),0)}function left(v){return Math.max(0,(+v.mg||0)-used(v)-(+v.lossMg||0))}function vialName(v){return String(v.peptideName||db.schedules.find(s=>s.id===v.schedule ><div class="row between"><strong>${esc(s.name)}</strong><span class="pill ${status==='taken'?'done':status==='skipped'?'skip':''}">${status==='taken'?'✓ Taken':status==='skipped'?'Skipped':'◷ Due'}</span></div><small>${esc(s.time||'Time not set')} · ${esc(s.route||'Route not set')} ${l?.site?'· '+esc(l.site):''}</small><div class="row between"><span>${fmt(s.dose,3)} ${esc(s.unit||'mg')}</span><span class="subtitle" style="margin:0">${s.units?fmt(s.units,2)+' syringe units':''}</span></div><div class="actions"><button class="btn small" onclick="record('${s.id}','${d}','taken')">✓ Taken</button><button class="btn secondary small" onclick="record('${s.id}','${d}','skipped')">Skipped</button>${l?`<button class="btn warn small" onclick="undo('${l.id}')">Undo</button>`:''}</div></div>`}function dayDoses(d){let a=planned(d);return a.length?a.map(s=>cardDose(s,d)).join(''):`<div class="empty bunny-empty"><img class="bunny-art" src="./bunny-floral.webp" alt="" loading="lazy"><div>No doses scheduled for this date. ♡</div><button class="btn secondary small bunny-action" onclick="go('settings')">+ Add schedule</button></div>`}function dailyBloom(){

function vialCard(v){let s=db.schedules.find(x=>x.id===v.scheduleId)||db.schedules.find(x=>peptideKey(x.name)===peptideKey(vialName(v))),rem=left(v),d=doseMg(s||{});return `<div class="vial-item"><div class="panel-head"><strong>${esc(v.label||'Vial')}</strong><span class="pill">${esc(v.status)}</span></div><div class="mini-grid"><div><b>${fmt(rem,3)}</b>mg left</div><div><b>${fmt(used(v),3)}</b>mg logged</div><div><b>${d?Math.floor(rem/d):'—'}</b>nominal doses</div></div><div class="progress"><div style="width:${v.mg?Math.min(100,rem/v.mg*100):0}%"></div></div><p class="subtitle">${fmt(v.mg,3)} mg original · ${esc(v.date||'No recon date')}${v.lossMg?` · ${fmt(v.lossMg,3)} mg recorded loss`:''}</p><div class="actions"><button class="btn secondary small" onclick="editVial('${v.id}')">Edit</button><button class="btn secondary small" onclick="vialStatus('${v.id}')">Status</button><button class="btn warn small" onclick="deleteVial('${v.id}')">Delete</button></div><details><summary>Vial history</summary>${(v.events||[]).map(e=>`<p class="subtitle">${esc(e.at)} · ${esc(e.action)}</p>`).join('')}${db.logs.filter(l=>l.vialId===v.id&&l.status==='taken').map(l=>`<p class="subtitle">${esc(l.actual||l.scheduledDate)} · ${fmt(l.doseMg,3)} mg logged</p>`).join('')}</details></div>`}

function vials(){return title('Vial tracker','Your stock stays together by peptide, even across purchases.')+`<section class="panel" id="stockForm"><h2>♡ Add vial stock</h2><p class="subtitle">New purchases of the same peptide automatically join its existing collection. No schedule required.</p><form class="fields" onsubmit="addVial(event)"><label class="field full">Peptide name<input name="peptideName" type="text" placeholder="Type any peptide name" maxlength="90" autocomplete="off" list="peptideSuggestions" required><datalist id="peptideSuggestions">${peptideGroups().map(g=>`<option value="${esc(g.name)}"></option>`).join('')}</datalist></label><label class="field">Label / batch name<input name="label" required placeholder="Batch A"></label><label class="field">Number of vials<input name="quantity" type="number" min="1" max="100" step="1" value="1" required></label><label class="field">Content per vial (mg)<input name="mg" type="number" min="0.00001" step="any" required></label><label class="field">Status<select name="status"><option>Unopened</option><option>Reconstituted</option></select></label><label class="field">Diluent (mL)<input name="ml" type="number" min="0" step="any"></label><label class="field full">Reconstitution date<input name="date" type="date"></label><button class="btn full">♡ Add to inventory</button></form></section><div class="group-heading"><h2>Your peptide collection</h2><p class="subtitle">One card per peptide · tap to view individual vials</p></div>${peptideGroups().map(groupCard).join('')||'<div class="empty">No vials registered yet.</div>'}<div class="note">Content remaining is an arithmetic estimate, excluding unrecorded losses, dead space and product stability.</div>`}
function addVial(e){e.preventDefault();let f=new FormData(e.target),name=String(f.get('peptideName')||'').trim(),count=Number(f.get('quantity')),mg=Number(f.get('mg'));if(!name)return alert('Type a peptide name first.');if(!Number.isInteger(count)||count<1||count>100||!Number.isFinite(mg)||mg<=0)return alert('Enter 1–100 vials and a positive content per vial.');name=peptideGroups().find(g=>peptideKey(g.name)===peptideKey(name))?.name||name;let label=String(f.get('label')||'Vial').trim()||'Vial',ml=Number(f.get('ml')||0);if(!Number.isFinite(ml)||ml<0)return alert('Invalid diluent volume');for(let i=0;i<count;i++)db.vials.push({id:uid(),peptideName:name,scheduleId:null,label:count>1?label+' '+String(i+1).padStart(2,'0'):label,mg,lossMg:0,ml,date:f.get('date'),status:f.get('status'),events:[{at:today(),action:'Registered stock independently'}]});save();render()}function editVial(id){let v=db.vials.find(x=>x.id===id);if(!v)return;let name=prompt('Peptide name:',vialName(v));if(name===null)return;name=name.trim();if(!name)return alert('Peptide name required');let label=prompt('Vial label:',v.label||'Vial');if(label===null)return;label=label.trim();if(!label)return alert('Label cannot be empty');let mgText=prompt('Total vial content in mg:',String(v.mg));if(mgText===null)return;let mg=Number(mgText);if(!Number.isFinite(mg)||mg<=0)return alert('Enter a positive content amount');let lossText=prompt('Additional used/wasted amount in mg (not already logged as Taken):',String(v.lossMg||0));if(lossText===null)return;let loss=Number(lossText);if(!Number.isFinite(loss)||loss<0||mg+1e-8<used(v)+loss)return alert('Content must cover logged usage plus any additional loss.');let mlText=prompt('Diluent volume in mL (0 if unknown):',String(v.ml||0));if(mlText===null)return;let ml=Number(mlText);if(!Number.isFinite(ml)||ml<0)return alert('Invalid volume');v.events=v.events||[];v.events.push({at:today(),action:'Edited vial details; extra loss '+loss+' mg'});Object.assign(v,{peptideName:name,scheduleId:null,label,mg,lossMg:loss,ml});save();render()}
function vialStatus(id){let v=db.vials.find(x=>x.id===id);if(!v)return;let status=prompt('Enter: Unopened, Reconstituted, Finished, or Discarded',v.status);if(status===null)return;if(!['Unopened','Reconstituted','Finished','Discarded'].includes(status))return alert('Invalid status');if(status==='Reconstituted'&&v.status!=='Reconstituted'){let d=prompt('Reconstitution date YYYY-MM-DD:',today());if(d===null)return;if(!/^\d{4}-\d\d-\d\d$/.test(d))return alert('Invalid date');v.date=d}v.events=v.events||[];v.events.push({at:today(),action:v.status+' → '+status});v.status=status;save();render()}function deleteVial(id){if(db.logs.some(l=>l.vialId===id&&l.status==='taken'))return alert('This vial has recorded doses. Keep it for accurate history, or change its status to Finished/Discarded.');if(!confirm('Delete this unused vial?'))return;db.vials=db.vials.filter(v=>v.id!==id);save();render()}function stock(){return title('Inventory & stock','See what is left for each planned cycle.')+`<section class="panel"><div class="panel-head"><h2>♡ Your vial collection</h2><button class="btn secondary small" onclick="go('vials')">+ Manage vials</button></div><div class="mini-grid"><div><b>${db.vials.length}</b>total vials</div><div><b>${db.vials.filter(v=>v.status==='Unopened').length}</b>unopened</div><div><b>${db.vials.filter(v=>v.status==='Reconstituted').length}</b>reconstituted</div><div><b>${fmt(db.vials.filter(v=>['Unopened','Reconstituted'].includes(v.status)).reduce((a,v)=>a+left(v),0),3)}</b>mg nominally left</div></div></section>`+`<section class="panel"><h2>♡ Stock by peptide</h2><p class="subtitle">New purchases are added to existing peptide totals.</p>${peptideGroups().map(g=>{let vs=g.vials;return `<div class="stock-line"><div><b>${esc(g.name)}</b><p class="subtitle">${vs.length} vial(s) · ${db.schedules.some(s=>peptideKey(s.name)===peptideKey(g.name))?'Schedule available':'Not scheduled'}</p></div><b>${fmt(vs.filter(v=>['Unopened','Reconstituted'].includes(v.status)).re /section><section class="panel"><h2>Scheduled peptides</h2>${db.schedules.map(x=>`<div class="stock-line"><div><strong>${esc(x.name)}</strong><div class="subtitle">${esc(x.time)} · ${esc(x.freq)} ${x.paused?'· Paused':''}</div></div><div class="toolbar"><button class="btn secondary small" onclick="editing='${x.id}';render()">Edit</button><button class="btn secondary small" onclick="togglePause('${x.id}')">${x.paused?'Resume':'Pause'}</button><button class="btn warn small" onclick="deleteSchedule('${x.id}')">×</button></div></div>`).join('')||'<div class="empty bunny-empty"><img class="bunny-art" src="./bunny-floral.webp" alt="" loading="lazy"><div>Add your first schedule below. ♡</div></div>'}</section><section class="panel"><h2>${s?'Edit':'Add'} schedule</h2><form class="fields" onsubmit="submitSchedule(event)"><label class="field full">Name<input name="name" value="${esc(s?.name||'')}" required></label><label class="field">Time<input type="time" name="time" value="${esc(s?.time||'18:00')}" required></label><label class="field">Route<input name="route" value="${esc(s?.route||'')}"></label><label class="field">Dose amount<input type="number" min="0" step="any" name="dose" value="${esc(s?.dose||'')}"></label><label class="field">Unit<select name="unit"><option ${s?.unit==='mg'?'selected':''}>mg</option><option ${s?.unit==='mcg'?'selected':''}>mcg</option></select></label><label class="field">Syringe units<input type="number" min="0" step="any" name="units" value="${esc(s?.units||'')}"></label><div class="field full freq-picker"><span class="field-label">Frequency</span><input type="hidden" name="freq" id="freq" value="${esc(s?.freq||'daily')}"><div class="freq-choices" role="group" aria-label="Frequency"><button type="button" data-freq="daily" onclick="chooseFreq('daily')">Daily</button><button type="button" data-freq="interval" onclick="chooseFreq('interval')">Every N days</button><button type="button" data-freq="weekdays" onclick="chooseFreq('weekdays')">Weekdays</ kMonth=new Date().getMonth(),pickYear=new Date().getFullYear();function chooseFreq(f){document.getElementById('freq').value=f;freqFields()}function toggleWeekday(n){let input=document.getElementById('days'),days=new Set(input.value.split(',').filter(x=>x!==''));days.has(String(n))?days.delete(String(n)):days.add(String(n));input.value=[...days].sort().join(',');freqFields()}function shiftPickMonth(n){let d=new Date(pickYear,pickMonth+n,1);pickYear=d.getFullYear();pickMonth=d.getMonth();drawPickDates()}function togglePickDate(date){let input=document.getElementById('dates'),dates=new Set(input.value.split(',').filter(Boolean));dates.has(date)?dates.delete(date):dates.add(date);input.value=[...dates].sort().join(',');drawPickDates()}function drawPickDates(){let grid=document.getElementById('datePickGrid');if(!grid)return;let selected=new Set(document.getElementById('dates').value.split(',').filter(Boolean));document.getElementById('selectedDatesCount').textContent=selected.size;document.getElementById('pickMonthTitle').textContent=new Date(pickYear,pickMonth,1).toLocaleDateString(undefined,{month:'long',year:'numeric'});let first=new Date(pickYear,pickMonth,1).getDay(),total=new Date(pickYear,pickMonth+1,0).getDate();let html=['S','M','T','W','T','F','S'].map(x=>`<span class="date-weekname">${x}</span>`).join('');html+='<span class="date-empty"></span>'.repeat(first);for(let day=1;day<=total;day++){let date=pickYear+'-'+String(pickMonth+1).padStart(2,'0')+'-'+String(day).padStart(2,'0');html+=`<button type="button" aria-pressed="${selected.has(date)}" class="${selected.has(date)?'chosen':''}" onclick="togglePickDate('${date}')">${day}</button>`}grid.innerHTML=html}function freqFields(){let f=document.getElementById('freq')?.value;if(!f)return;for(let id of ['intervalField','weekField','datesField']){let el=document.getElementById(id);if(el)el.style.display=({intervalField:'interval',weekField:'weekdays',datesField:'dates'}[id]===f)?'':'none'}document.querySelectorAll('[data-freq]').forEach(b=>{let active=b.dataset.freq===f;b.classList.toggle('selected',active);b.setAttribute('aria-pressed',String(active))});let days=new Set((document.getElementById('days')?.value||'').split(','));document.querySelectorAll('[data-weekday]').forEach(b=>{let on=days.has(b.dataset.weekday);b.classList.toggle('selected',on);b.setAttribute('aria-pressed',String(on))});if(f==='dates')drawPickDates()}function setNick(e){e.preventDefault();db.prefs.nickname=String(new FormData(e.target).get('nick')||'').trim();save();render()}function submitSchedule(e){e.preventDefault();let f=new FormData(e.target),start=f.get('start'),end=f.get('end');if(end&&end<start)return alert('End date must be after start date');let days=String(f.get('days')||'').split(',').map(Number).filter(x=>Number.isInteger(x)&&x>=0&&x<=6);if(f.get('freq')==='weekdays'&&!days.length)return alert('Select at least one weekday');let dates=String(f.get('dates')||'').split(',').filter(x=>/^\d{4}-\d{2}-\d{2}$/.test(x));if(f.get('freq')==='dates'&&!dates.length)return alert('Please select at least one date');let old=db.schedules.find(x=>x.id===editing)||{};let obj={...old,id:editing||uid(),name:String(f.get('name')).trim(),time:f.get('time'),route:f.get('route'),dose:+f.get('dose')||0,unit:f.get('unit'),units:+f.get('units')||0,freq:f.get('freq'),interval:Math.max(1,+f.get('interval')||1),days,dates,start,end};if(editing)db.schedules=db.schedules.map(x=>x.id===editing?obj:x);else db.schedules.push(obj);editing=null;save();render()}function togglePause(id){let s=db.schedules.find(x=>x.id===id);if(!s)return;if(s.paused){s.paused=false;s.resume=''}else{let d=prompt('Optional planned resume date YYYY-MM-DD (blank = indefinite pause):','');if(d===null)return;if(d&&!/^\d{4}-\d\d-\d\d$/.test(d))return alert('Invalid date');s.paused=true;s.resume=d}save();render()}function deleteSchedule(id){if(!confirm('Delete schedule? Historical records are kept.'))return;db.schedules=db.schedules.filter(s=>s.id!==id);save();render()}function calc(){return title('Peptide calculator','Arithmetic based only on your entered values.')+`<section class="panel"><div class="fields"><label class="field">Vial content (mg)<input id="cmg" type="number" min="0" step="any" value="10" oninput="updateCalc()"></label><label class="field">Diluent (mL)<input id="cml" type="number" min="0" step="any" value="2" oninput="updateCalc()"></label><label class="field">Entered dose (mg)<input id="cd" type="number" min="0" step="any" value="1" oninput="updateCalc()"></label><label class="field">Syringe units per mL<input id="cu" type="number" min="0" step="any" value="100" oninput="updateCalc()"></label></div><div id="calcResult"></div><div class="note">This does not recommend a dose, injection route, or medication regimen. Verify product concentration and syringe calibration independently.</div></section>`}function updateCalc(){let mg=+document.getElementById('cmg').value,ml=+document.getElementById('cml').value,d=+document.getElementById('cd').value,u=+document.getElementById('cu').value;document.getElementById('calcResult').innerHTML=mg>0&&ml>0&&d>0&&u>0?`<div class="mini-grid" style="margin-top:14px"><div><b>${fmt(mg/ml,4)}</b>mg/mL</div><div><b>${fmt(d*ml/mg,4)}</b>mL</div><div><b>${fmt(d*ml/mg*u,2)}</b>syringe units</div></div>`:'<div class="note">Enter positive numbers in every field.</div>'}function historyTable(){let logs=[...db.logs].sort((a,b)=>(b.actual||b.scheduledDate).localeCompare(a.actual||a.scheduledDate));return `<section class="panel"><h2>Recorded history</h2>${logs.length?`<div class="table-wrap"><table class="table"><thead><tr><th>Scheduled</th><th>Name</th><th>Status</th><th>Actual</th></tr></thead><tbody>${logs.map(l=>`<tr><td>${esc(l.scheduledDate)}</td><td>${esc(l.name)}</td><td>${esc(l.status)}</td><td>${esc(l.actual||'—')}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty bunny-empty"><img class="bunny-art" src="./bunny-floral.webp" alt="" loading="lazy"><div>No entries logged yet. ♡</div></div>'}</section>`}function history(){return title('Dose history','Your administration log over time.')+historyTable()}function exportData(){let blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='petaldose-backup-'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}document.getElementById('import').addEventListener('change',async e=>{let f=e.target.files[0];if(!f)return;try{let d=JSON.parse(await f.text());if(!Array.isArray(d.schedules)||!Array.isArray(d.logs)||!Array.isArray(d.vials))throw Error('Invalid backup');if(confirm('Replace all local records with this backup?')){db=d;db.prefs=db.prefs||{};save();render()}}catch(err){alert(err.message)}e.target.value='' });function render(){nav();document.getElementById('root').innerHTML=({home,doses,vials,stock,more,settings,schedules:settings,calc,history}[page])();if(page==='settings'||page==='schedules')freqFields();if(page==='calc')updateCalc()}render();
